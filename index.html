<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amharic AI Creator</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px;
    }

    .header {
      text-align: center;
      padding: 25px 10px;
    }

    .header h1 {
      margin-bottom: 8px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #d6dce5;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 18px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #111827;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      display: none;
    }

    .step {
      padding: 12px;
      margin: 8px 0;
      background: #f1f5f9;
      border-radius: 10px;
    }

    .footer {
      text-align: center;
      font-size: 13px;
      margin-top: 25px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🇪🇹 Amharic AI Creator</h1>
      <p>AI በመጠቀም የአማርኛ Content እንፍጠር</p>
    </div>

    <div class="card">

      <label>📝 ስለ ምን Content መፍጠር ትፈልጋለህ?</label>

      <textarea id="topic"
        placeholder="ለምሳሌ፦ AI በኢትዮጵያ ምን ሊረዳን ይችላል?"></textarea>

      <label>⏱️ Duration</label>

      <select id="duration">
        <option value="30">30 seconds</option>
        <option value="60" selected>60 seconds</option>
        <option value="90">90 seconds</option>
      </select>

      <label>🎭 Content Style</label>

      <select id="style">
        <option>Education</option>
        <option>News</option>
        <option>Motivation</option>
        <option>Entertainment</option>
      </select>

      <label>📱 Platform</label>

      <select id="platform">
        <option>TikTok</option>
        <option>YouTube Shorts</option>
        <option>YouTube</option>
      </select>

      <button onclick="createContent()">
        🚀 CREATE CONTENT
      </button>

    </div>

    <div class="card" id="result">

      <h2>🎬 Content Production</h2>

      <div class="step">💡 Idea → Ready</div>
      <div class="step">📝 Script → Ready</div>
      <div class="step">🎙️ Amharic Voice → Ready</div>
      <div class="step">🎬 Visuals → Ready</div>
      <div class="step">📝 Subtitle → Ready</div>
      <div class="step">🎵 Music → Ready</div>
      <div class="step">📱 Video Format → Ready</div>

      <br>

      <button onclick="alert('AI engine will be connected in the next step.')">
        ▶️ GENERATE VIDEO
      </button>

    </div>

    <div class="footer">
      Amharic AI Creator 🇪🇹 — Prototype
    </div>

  </div>

  <script>

    function createContent() {

      const topic = document.getElementById("topic").value.trim();

      if (topic === "") {
        alert("እባክህ Topic አስገባ።");
        return;
      }

      document.getElementById("result").style.display = "block";

      document.getElementById("result").scrollIntoView({
        behavior: "smooth"
      });
    }

  </script>

</body>
</html>
